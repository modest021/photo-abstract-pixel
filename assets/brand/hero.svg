  <text x="474" y="314" fill="#6578B2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="56" font-weight="800" letter-spacing="8">PIXEL</text>
  <text x="476" y="374" fill="#536071" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="1.5">UNDERSTAND THE PHOTO. REBUILD THE RELATIONSHIPS.</text>
